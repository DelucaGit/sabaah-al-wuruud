<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Dua hands holding a rose</title>
  <!-- Single lavender silhouette on white. Artwork stays inside the central 66% circle (r 338)
       so Android adaptive-icon masks never clip it. -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <defs>
    <g id="hand" fill="#8E64C6" stroke="#8E64C6" stroke-linecap="round" stroke-linejoin="round">
      <!-- palm and wrist -->
      <path stroke="none" d="M -78,-200 L 78,-200 C 82,-134 74,-84 56,-44 C 50,-30 48,-12 48,14
               C 48,34 -48,34 -48,14 C -48,-12 -52,-32 -64,-54 C -78,-82 -84,-134 -78,-200 Z"/>
      <!-- fingers: index, middle, ring, little -->
      <path fill="none" stroke-width="33" d="M -60,-196 L -63,-330"/>
      <path fill="none" stroke-width="33" d="M -20,-196 L -21,-362"/>
      <path fill="none" stroke-width="33" d="M 20,-196 L 21,-346"/>
      <path fill="none" stroke-width="31" d="M 60,-196 L 62,-296"/>
      <!-- thumb -->
      <path fill="none" stroke-width="38" d="M -54,-96 C -86,-122 -108,-152 -122,-200"/>
    </g>
    <g id="bloom">
      <g fill="#8E64C6">
        <circle r="62"/>
        <circle cx="0" cy="-52" r="46"/>
        <circle cx="49" cy="-16" r="46"/>
        <circle cx="31" cy="42" r="46"/>
        <circle cx="-31" cy="42" r="46"/>
        <circle cx="-49" cy="-16" r="46"/>
      </g>
      <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
        <path d="M 4,-4 C -10,-20 -30,-4 -20,14 C -8,36 30,30 34,2 C 38,-28 6,-50 -26,-40
                 C -56,-30 -64,8 -44,36"/>
        <path d="M -44,36 C -22,66 30,66 52,36"/>
        <path d="M 60,-34 C 74,-8 70,18 52,36"/>
      </g>
    </g>
    <path id="leaf" fill="#8E64C6" d="M 0,0 C 14,-34 52,-48 88,-36 C 78,-4 40,14 0,0 Z"/>
    <path id="petal" fill="#8E64C6" d="M 0,-26 C 20,-14 22,12 0,26 C -22,12 -20,-14 0,-26 Z"/>
  </defs>
  <g id="hands">
    <use href="#hand" transform="translate(400,770) rotate(-19) scale(1.04)"/>
    <use href="#hand" transform="translate(624,770) rotate(19) scale(-1.04,1.04)"/>
  </g>
  <g id="rose">
    <!-- white halo: the bloom outline, slightly larger -->
    <g fill="#FFFFFF" transform="translate(512,446) scale(1.44)">
      <circle r="62"/>
      <circle cx="0" cy="-52" r="46"/>
      <circle cx="49" cy="-16" r="46"/>
      <circle cx="31" cy="42" r="46"/>
      <circle cx="-31" cy="42" r="46"/>
      <circle cx="-49" cy="-16" r="46"/>
    </g>
    <path fill="none" stroke="#8E64C6" stroke-width="15" stroke-linecap="round" d="M 512,540 C 522,628 502,628 512,716"/>
    <use href="#leaf" transform="translate(514,668) rotate(-6) scale(0.56)"/>
    <use href="#leaf" transform="translate(510,636) rotate(6) scale(-0.52,0.52)"/>
    <use href="#bloom" transform="translate(512,446) scale(1.24)"/>
  </g>
</svg>
